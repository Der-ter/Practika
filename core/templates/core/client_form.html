{% extends "core/base.html" %}
{% block title %}Новый клиент — ПринтУчёт{% endblock %}
{% block content %}
<div class="page-head"><h1 class="page-title">Новый клиент</h1><a href="{% url 'order_create' %}" class="btn">Назад к заказу</a></div>
<form method="post" class="card" novalidate>
  {% csrf_token %}
  {% for field in form %}
    <div class="field">
      <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
    </div>
  {% endfor %}
  <div class="filters__actions"><button class="btn btn--primary" type="submit">Сохранить клиента</button><a class="btn" href="{% url 'order_create' %}">Отмена</a></div>
</form>
{% endblock %}
